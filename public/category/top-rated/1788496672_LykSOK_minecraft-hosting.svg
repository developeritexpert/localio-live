    <g fill="#214787">
      <rect x="183.6" y="62.6" width="9.6" height="9.6"/>
      <rect x="202.8" y="62.6" width="9.6" height="9.6"/>
      <rect x="193.2" y="72.2" width="9.6" height="9.6"/>
      <rect x="188.4" y="77.0" width="19.2" height="9.6"/>
      <rect x="188.4" y="86.6" width="4.8" height="9.6"/>
      <rect x="202.8" y="86.6" width="4.8" height="9.6"/>
    </g>

    <!-- small chassis fasteners -->
    <circle cx="59" cy="47" r="1.5" fill="#7999C0"/>
    <circle cx="226" cy="47" r="1.5" fill="#7999C0"/>
    <circle cx="59" cy="107" r="1.5" fill="#7999C0"/>
    <circle cx="226" cy="107" r="1.5" fill="#7999C0"/>
