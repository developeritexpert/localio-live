<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <g>
    <!-- quiet block-based support geometry -->
    <rect x="25" y="49" width="25" height="25" rx="3" fill="#f7f9fb"/>
    <rect x="37" y="30" width="18" height="18" rx="2" fill="#DDEAF7"/>
    <rect x="239" y="30" width="21" height="21" rx="3" fill="#DDEAF7"/>
    <rect x="259" y="91" width="15" height="15" rx="2" fill="#f7f9fb"/>
    <circle cx="197" cy="76" r="55" fill="#f7f9fb"/>

    <!-- secondary rear block rhythm -->
    <rect x="42" y="91" width="28" height="22" rx="3" fill="#DDEAF7"/>
    <rect x="227" y="99" width="29" height="21" rx="3" fill="#DDEAF7"/>

    <!-- primary Minecraft-hosting server chassis -->
    <rect x="52" y="39" width="181" height="76" rx="4" fill="#fdfdfd" stroke="#214787" stroke-width="1.4"/>

    <!-- server modules -->
    <rect x="66" y="52" width="91" height="22" rx="3" fill="#DDEAF7" stroke="#7999C0" stroke-width="1"/>
    <rect x="66" y="80" width="91" height="22" rx="3" fill="#f7f9fb" stroke="#7999C0" stroke-width="1"/>

    <!-- module details -->
    <line x1="78" y1="59" x2="112" y2="59" stroke="#7999C0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="78" y1="64" x2="103" y2="64" stroke="#7999C0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="78" y1="69" x2="118" y2="69" stroke="#7999C0" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="145" cy="63" r="3.4" fill="#fb5c28"/>

    <line x1="78" y1="87" x2="116" y2="87" stroke="#7999C0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="78" y1="92" x2="106" y2="92" stroke="#7999C0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="78" y1="97" x2="121" y2="97" stroke="#7999C0" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="145" cy="91" r="2.7" fill="#7999C0"/>

    <line x1="168" y1="49" x2="168" y2="105" stroke="#7999C0" stroke-width="1" stroke-linecap="round"/>

